name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Validate Android build environment
        run: npm run cap:check-env

      - name: Export web bundle
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Caliper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caliper.apk
          path: android/app/build/outputs/apk/debug/Caliper.apk

      - name: Move latest Android release tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin android-latest

      - name: Publish APK to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android APK
          body: Latest debug APK built from main.
          make_latest: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/Caliper.apk

      - name: Publish APK to versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/Caliper.apk
